name: Deploy to Cloudflare

# Shared by every halesapp repo. A repo with a package.json is built first and
# its wrangler.jsonc points at the build output; one without is deployed as is.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build
      # The token is scoped to this step so install scripts in the build never see it.
      - name: Deploy
        run: npx --yes wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
